<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Tasks for Nick</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<!--
  The standalone task screen — tasks.nickward.co.uk.

  Sign in with a username and PIN, add something for Nick, and see what became
  of the things you already sent.

  ⚠ It shows ONLY this account's own submissions. That is enforced on the server
  by a `source` match in the query, not by filtering here — a boundary enforced
  in a UI is one a future change walks straight through. Nothing else about
  Nick's day is reachable from this page: not his other tasks, not counts, not
  his calendar.

  ⚠ The PIN is never stored. The session token is, in localStorage, and it
  expires server-side after twelve hours.

  Deliberately one hand-written file with no build step. It is the least likely
  thing in this repo to be touched again, and a toolchain that has to be revived
  before a one-line fix is how a small thing becomes unmaintainable.
-->
<style>
  :root {
    --bg: #f6f6f8; --card: #fff; --ink: #14141a; --muted: #6b6b76;
    --line: #e2e2e8; --accent: #0f766e; --accent-ink: #fff;
    --bad: #b42318; --done: #15803d; --wait: #b45309; --off: #6b6b76;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316; --card: #1e1e22; --ink: #f2f2f5; --muted: #9a9aa4;
      --line: #34343c; --accent: #2dd4bf; --accent-ink: #06201d;
      --bad: #ff8a7a; --done: #4ade80; --wait: #fbbf24; --off: #9a9aa4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex; justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 460px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 5px; }
  input, textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    font: inherit; font-size: 16px; /* 16px min, or iOS zooms the page on focus */
    color: inherit; background: transparent;
  }
  textarea { min-height: 88px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field + .field { margin-top: 12px; }
  button {
    width: 100%; border: 0; border-radius: 10px; background: var(--accent);
    color: var(--accent-ink); font: inherit; font-weight: 600; padding: 13px 16px;
    cursor: pointer; min-height: 46px; margin-top: 12px;
  }
  button[disabled] { opacity: .5; cursor: default; }
  button.link {
    background: none; color: var(--muted); font-weight: 400; font-size: 13px;
    min-height: 0; padding: 6px; margin: 0; width: auto;
  }
  .msg { margin-top: 12px; font-size: 14px; min-height: 20px; }
  .msg.bad { color: var(--bad); }
  .msg.good { color: var(--done); }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 24px 0 8px; text-transform: uppercase; letter-spacing: .05em; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--line); padding: 11px 0; display: flex; gap: 10px; align-items: baseline; }
  li .t { flex: 1; }
  li .t.done { color: var(--muted); text-decoration: line-through; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .tag.done { color: var(--done); }
  .tag.todo { color: var(--wait); }
  .tag.progress { color: var(--accent); }
  .tag.off { color: var(--off); }
  .when { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1 id="title">Tasks for Nick</h1>
      <p class="sub" id="sub">Sign in to add something.</p>
    </div>
    <button class="link" id="out" hidden type="button">Sign out</button>
  </div>

  <!-- Sign in -->
  <div class="card" id="loginCard">
    <div class="field">
      <label for="user">Name</label>
      <input id="user" autocomplete="username" autocapitalize="none" autocorrect="off" enterkeyhint="next">
    </div>
    <div class="field">
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" enterkeyhint="go">
    </div>
    <button id="in" type="button">Sign in</button>
    <div class="msg" id="loginMsg" role="status" aria-live="polite"></div>
  </div>

  <!-- Add + list -->
  <div id="app" hidden>
    <div class="card">
      <label for="text">Add something</label>
      <textarea id="text" placeholder="e.g. Book the dentist" enterkeyhint="send" autocapitalize="sentences"></textarea>
      <button id="add" type="button">Add it</button>
      <div class="msg" id="addMsg" role="status" aria-live="polite"></div>
    </div>

    <h2>What you have sent</h2>
    <ul id="list"></ul>
    <p class="foot" id="foot"></p>
  </div>
</main>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'neuro_capture_token';
  var QUEUE_KEY = 'neuro_capture_queue';
  var API = (window.NEURO_API_BASE || '').replace(/\/+$/, '');

  var el = function (id) { return document.getElementById(id); };
  var loginCard = el('loginCard'), app = el('app'), list = el('list');

  function store(key, value) {
    try {
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    } catch (e) { /* private mode */ }
  }
  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function say(node, text, kind) {
    node.textContent = text || '';
    node.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    var token = read(TOKEN_KEY);
    if (token) headers.Authorization = 'Bearer ' + token;
    return fetch(API + '/api/c' + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        return { status: r.status, body: b };
      });
    });
  }

  // ── The offline queue ──────────────────────────────────────────────────────
  // She may be standing in a shop with one bar. A message that silently fails
  // to send is worse than no page at all, so anything undelivered is kept and
  // retried, and the list says which is which.

  function queue() {
    try { return JSON.parse(read(QUEUE_KEY) || '[]'); } catch (e) { return []; }
  }
  function setQueue(q) { store(QUEUE_KEY, JSON.stringify(q.slice(-20))); }

  function tagFor(status) {
    if (status === 'done') return 'done';
    if (status === 'in progress') return 'progress';
    if (status === 'not doing') return 'off';
    return 'todo';
  }

  function render(tasks) {
    list.innerHTML = '';
    var pending = queue();

    pending.forEach(function (item) {
      var li = document.createElement('li');
      var t = document.createElement('span');
      t.className = 't';
      // textContent, never innerHTML — this is user input going back onto the
      // page, and it is the one place an injection could land.
      t.textContent = item.text;
      var tag = document.createElement('span');
      tag.className = 'tag off';
      tag.textContent = 'sending';
      li.appendChild(t); li.appendChild(tag);
      list.appendChild(li);
    });

    (tasks || []).forEach(function (task) {
      var li = document.createElement('li');
      var t = document.createElement('span');
      t.className = 't' + (task.status === 'done' ? ' done' : '');
      t.textContent = task.text;
      var tag = document.createElement('span');
      tag.className = 'tag ' + tagFor(task.status);
      tag.textContent = task.status;
      li.appendChild(t);
      if (task.dueDate) {
        var when = document.createElement('span');
        when.className = 'when';
        when.textContent = task.dueDate;
        li.appendChild(when);
      }
      li.appendChild(tag);
      list.appendChild(li);
    });

    if (!list.children.length) {
      var li = document.createElement('li');
      li.className = 'when';
      li.textContent = 'Nothing yet.';
      list.appendChild(li);
    }

    var waiting = pending.length;
    el('foot').textContent = waiting
      ? waiting + ' waiting to send — they will go when you are back online.'
      : '';
  }

  function refresh() {
    return api('/tasks').then(function (res) {
      if (res.status === 401) { signedOut('Your session expired. Sign in again.'); return; }
      if (res.body && res.body.ok) {
        el('sub').textContent = 'Signed in as ' + res.body.label + '.';
        render(res.body.tasks);
      }
    }).catch(function () {
      // Offline: the queue is still shown, so the page is never blank.
      render([]);
    });
  }

  function flush() {
    var q = queue();
    if (!q.length) return Promise.resolve();
    var next = q[0];
    return api('/tasks', { method: 'POST', body: { text: next.text } }).then(function (res) {
      if (res.status === 200) {
        setQueue(q.slice(1));
        render(res.body.tasks);
        return flush();
      }
      if (res.status === 401) { signedOut('Your session expired. Sign in again.'); return; }
      // A 4xx will never succeed on a retry, so it is dropped rather than
      // retried for ever — but it is reported, not swallowed.
      if (res.status >= 400 && res.status < 500 && res.status !== 429) {
        setQueue(q.slice(1));
        say(el('addMsg'), (res.body && res.body.error) || 'That could not be added.', 'bad');
        render([]);
        refresh();
      }
    }).catch(function () { /* still offline; leave it queued */ });
  }

  // ── Session ────────────────────────────────────────────────────────────────

  function signedIn() {
    loginCard.hidden = true;
    app.hidden = false;
    el('out').hidden = false;
    refresh().then(flush);
  }

  function signedOut(message) {
    store(TOKEN_KEY, null);
    loginCard.hidden = false;
    app.hidden = true;
    el('out').hidden = true;
    el('sub').textContent = 'Sign in to add something.';
    if (message) say(el('loginMsg'), message, 'bad');
  }

  el('in').addEventListener('click', function () {
    var username = el('user').value.trim();
    var pin = el('pin').value;
    if (!username || !pin) { say(el('loginMsg'), 'Both, please.', 'bad'); return; }

    el('in').disabled = true;
    say(el('loginMsg'), '');
    api('/login', { method: 'POST', body: { username: username, pin: pin } })
      .then(function (res) {
        el('in').disabled = false;
        if (res.body && res.body.ok) {
          // The PIN itself is never stored — only the session token, which the
          // server expires after twelve hours.
          store(TOKEN_KEY, res.body.token);
          el('pin').value = '';
          say(el('loginMsg'), '');
          signedIn();
          return;
        }
        say(el('loginMsg'), (res.body && res.body.error) || 'That did not work.', 'bad');
      })
      .catch(function () {
        el('in').disabled = false;
        say(el('loginMsg'), "Can't reach Nick's system right now.", 'bad');
      });
  });

  el('out').addEventListener('click', function () { signedOut(null); });

  el('add').addEventListener('click', function () {
    var text = el('text').value.trim();
    if (!text) return;
    var q = queue();
    q.push({ text: text.slice(0, 500) });
    setQueue(q);
    el('text').value = '';
    render([]);
    say(el('addMsg'), '');
    el('add').disabled = true;
    flush().then(function () {
      el('add').disabled = false;
      say(el('addMsg'), queue().length ? 'Saved — it will send when you are back online.' : 'Added.', queue().length ? null : 'good');
      return refresh();
    });
  });

  el('pin').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); el('in').click(); }
  });
  el('text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el('add').click(); }
  });
  window.addEventListener('online', flush);

  if (read(TOKEN_KEY)) signedIn(); else signedOut(null);
}());
</script>
</body>
</html>
